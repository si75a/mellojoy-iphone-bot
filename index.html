<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mellojoy Bot</title>

<style>
body {
  font-family: sans-serif;
  background: #f7f5fa;
  color: #333;
  padding: 20px;
}
.container {
  max-width: 500px;
  margin: 20px auto;
  background: white;
  padding: 22px;
  border-radius: 20px;
  box-shadow: 0 3px 15px #ddd;
}
h1 {
  text-align: center;
  color: #8d6bb5;
}
input, select, button {
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 10px;
  font-size: 16px;
}
input, select {
  border: 1px solid #ccc;
}
button {
  border: none;
  background: #9876bd;
  color: white;
  font-weight: bold;
}
.product {
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 12px;
  margin-top: 15px;
}
.product img {
  width: 100%;
  max-height: 220px;
  object-fit: contain;
}
.stock {
  font-weight: bold;
}
.available {
  color: green;
}
.soldout {
  color: #d44;
}
.small {
  color: #777;
  font-size: 13px;
}
</style>
</head>

<body>
<div class="container">

<h1>Mellojoy Bot</h1>

<p>探したい商品名</p>
<input id="keyword" placeholder="例：Lスフレ">

<p>購入数量</p>
<select id="quantity">
  <option value="1">1個</option>
  <option value="2">2個</option>
  <option value="3">3個</option>
  <option value="4">4個</option>
  <option value="5">5個</option>
</select>

<button onclick="searchProducts()">商品を検索</button>

<p id="status" class="small"></p>
<div id="results"></div>

</div>

<script>
const API =
"https://www.mellojoyjapan.com/products.json?limit=250";

let products = [];

async function loadProducts() {
  const status = document.getElementById("status");

  status.textContent = "商品データを取得しています...";

  try {
    const response = await fetch(API);

    if (!response.ok) {
      throw new Error("商品データを取得できませんでした");
    }

    const data = await response.json();
    products = data.products || [];

    status.textContent =
      products.length + "件の商品データを取得しました。";

    return true;

  } catch (error) {
    status.textContent =
      "取得できませんでした。通信制限（CORS）の可能性があります。";
    return false;
  }
}

function normalize(text) {
  return text
    .toLowerCase()
    .replace(/[\s　\-ー・]/g, "");
}

function scoreProduct(title, keyword) {
  const t = normalize(title);
  const k = normalize(keyword);

  if (t === k) return 100;
  if (t.includes(k)) return 80;

  const parts = keyword.trim().split(/[\s　]+/);
  let score = 0;

  for (const part of parts) {
    if (t.includes(normalize(part))) {
      score += 20;
    }
  }

  return score;
}

async function searchProducts() {
  const keyword =
    document.getElementById("keyword").value.trim();

  const results = document.getElementById("results");
  const status = document.getElementById("status");

  if (!keyword) {
    alert("商品名を入力してください");
    return;
  }

  results.innerHTML = "";

  if (products.length === 0) {
    const success = await loadProducts();
    if (!success) return;
  }

  const matched = products
    .map(product => ({
      product,
      score: scoreProduct(product.title, keyword)
    }))
    .filter(item => item.score > 0)
    .sort((a, b) => b.score - a.score);

  if (matched.length === 0) {
    status.textContent = "一致する商品が見つかりませんでした。";
    return;
  }

  status.textContent =
    matched.length + "件の商品が見つかりました。";

  const quantity =
    document.getElementById("quantity").value;

  matched.forEach(item => {
    const p = item.product;

    const available = p.variants.some(v => v.available);

    const image = p.images && p.images.length
      ? p.images[0].src
      : "";

    const price = p.variants.length
      ? p.variants[0].price
      : "不明";

    const card = document.createElement("div");
    card.className = "product";

    const title = document.createElement("h3");
    title.textContent = p.title;
    card.appendChild(title);

    if (image) {
      const img = document.createElement("img");
      img.src = image;
      img.alt = p.title;
      card.appendChild(img);
    }

    const priceText = document.createElement("p");
    priceText.textContent = "価格：" + price + "円";
    card.appendChild(priceText);

    const stock = document.createElement("p");
    stock.className = "stock " +
      (available ? "available" : "soldout");

    stock.textContent =
      available ? "在庫あり" : "売り切れ";

    card.appendChild(stock);

    const variantText = document.createElement("p");
    variantText.className = "small";
    variantText.textContent =
      "商品コード：" +
      p.variants.map(v => v.sku || v.id).join(" / ");

    card.appendChild(variantText);

    const link = document.createElement("a");
    link.href =
      "https://www.mellojoyjapan.com/products/" + p.handle;
    link.target = "_blank";
    link.rel = "noopener";

    const button = document.createElement("button");
    button.textContent = "公式サイトで商品を確認";
    link.appendChild(button);

        card.appendChild(link);

    const addButton = document.createElement("button");
    addButton.textContent = "カートに追加";

    const firstVariant = Array.isArray(p.variants)
      ? p.variants.find(v => v.available === true)
      : null;

    if (available === true && firstVariant) {
      addButton.disabled = false;

      addButton.onclick = () => {
        const quantity = Number(
          document.getElementById("quantity").value
        );

        if (!Number.isInteger(quantity) || quantity < 1) {
          return;
        }

        addToCart(firstVariant.id, quantity);
      };
    } else {
      addButton.disabled = true;
      addButton.textContent = "売り切れ";
    }

    card.appendChild(addButton);

    card.appendChild(addButton);

    results.appendChild(card);
  });
}

// 日本時間の12:00〜12:02だけ監視
const START = 12 * 60 * 60 * 1000;
const END = START + 2 * 60 * 1000;

let monitorTimer = null;
let monitoring = false;

function getJapanTime() {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "Asia/Tokyo",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23"
  }).formatToParts(new Date());

  const values = {};
  parts.forEach(p => values[p.type] = p.value);

  return (
    Number(values.hour) * 3600000 +
    Number(values.minute) * 60000 +
    Number(values.second) * 1000 +
    new Date().getMilliseconds()
  );
}

async function updateProducts() {
  const status = document.getElementById("status");

  try {
    const response = await fetch(API, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("取得失敗");
    }

    const data = await response.json();
    products = data.products || [];

    status.textContent =
      `更新完了：${products.length}件`;
  } catch (error) {
    status.textContent = "商品データ取得に失敗しました。";
  }
}

function startMonitor() {
  if (monitoring) return;
  monitoring = true;

  const check = async () => {
    const now = getJapanTime();

    if (now >= END) {
      clearInterval(monitorTimer);
      monitoring = false;
      document.getElementById("status").textContent =
        "12:02になったため監視を終了しました。";
      return;
    }

    if (now >= START) {
      await updateProducts();
      monitorTimer = setTimeout(check, 500);
    } else {
      monitorTimer = setTimeout(check, START - now);
    }
  };

  check();
}
// カート追加処理
async function addToCart(variantId, quantity) {
  const status = document.getElementById("status");

  try {
    const response = await fetch(
      "https://www.mellojoyjapan.com/cart/add.js",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          items: [{
            id: Number(variantId),
            quantity: Number(quantity)
          }]
        })
      }
    );

    if (!response.ok) {
      throw new Error("カート追加に失敗しました");
    }

    status.textContent = "カートに追加しました！";

    window.open(
      "https://www.mellojoyjapan.com/cart",
      "_blank"
    );

  } catch (error) {
    status.textContent =
      "カート追加に失敗しました。公式サイトで確認してください。";
  }
}
startMonitor();
</script>

</body>
</html>
